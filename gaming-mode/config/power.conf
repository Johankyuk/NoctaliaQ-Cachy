# noctaliaq-power — política térmica y de GPU por perfil de energía
#
# Se instala en /etc/noctaliaq/power.conf.
# Un ~/.config/noctaliaq/power.conf tiene prioridad si existe.
#
# Formato: 8 puntos por curva, temperaturas en °C ASCENDENTES,
# PWM en 0-255 (el driver lo trata como porcentaje escalado: 255 = 100%).
# El kernel NO valida estas curvas — la cordura es responsabilidad de aquí.
#
# Criterio de diseño (ver README): estabilidad térmica > temperatura mínima.
# Sin pisos de 0% en performance (evita ciclos de arranque/paro del ventilador),
# sin saltos mayores a ~20 puntos de PWM entre puntos contiguos, y techo en 90%
# en vez de 100% (el último 10% cuesta mucho ruido y desgaste por ~2 °C).

# ---------------------------------------------------------------------------
# power-saver — silencio primero. El ventilador arranca tarde y sube despacio.
#               PWM 0 hasta 45 °C: en idle real el equipo queda mudo.
# ---------------------------------------------------------------------------
CURVE_POWERSAVER_CPU_TEMP="30 45 55 65 75 82 88 95"
CURVE_POWERSAVER_CPU_PWM="0   0  38 64 89 115 153 204"

CURVE_POWERSAVER_GPU_TEMP="30 45 55 62 70 76 82 88"
CURVE_POWERSAVER_GPU_PWM="0   0  38 64 89 115 153 204"

# ---------------------------------------------------------------------------
# balanced — uso diario. Ventilador audible pero de fondo hasta ~75 °C.
#            10% desde 45 °C mantiene el aire moviéndose y aplana los picos.
# ---------------------------------------------------------------------------
CURVE_BALANCED_CPU_TEMP="30 45 55 65 73 80 87 94"
CURVE_BALANCED_CPU_PWM="0   26 51 77 102 128 166 217"

CURVE_BALANCED_GPU_TEMP="30 45 55 62 68 74 80 87"
CURVE_BALANCED_GPU_PWM="0   26 51 77 102 128 166 217"

# ---------------------------------------------------------------------------
# performance — gaming. Piso de 20% permanente: el ventilador NUNCA para,
#               que es justo lo que evita el ciclado térmico agresivo.
#               Pendiente pareja, sin acantilados. Techo 90%.
# ---------------------------------------------------------------------------
CURVE_PERFORMANCE_CPU_TEMP="30 45 55 63 70 78 85 92"
CURVE_PERFORMANCE_CPU_PWM="51  64 89 115 140 166 191 230"

CURVE_PERFORMANCE_GPU_TEMP="30 45 55 62 68 74 80 87"
CURVE_PERFORMANCE_GPU_PWM="51  64 89 115 140 166 204 230"

# ---------------------------------------------------------------------------
# NVIDIA — política de reloj por perfil.
#
# Formato de NV_LGC_*: "min,max" en MHz para `nvidia-smi -lgc`, o vacío para
# soltar el reloj (`nvidia-smi -rgc`).
#
# OJO: si la dGPU está en runtime suspend (D3cold), noctaliaq-power NO la toca.
# Llamar a nvidia-smi la despertaría y quemaría batería justo en power-saver.
# ---------------------------------------------------------------------------
NV_LGC_POWERSAVER=""
NV_LGC_BALANCED=""
NV_LGC_PERFORMANCE=""

# Límite de potencia en watts (`nvidia-smi -pl`). Muchas GPU móviles lo
# rechazan. Deja vacío hasta que `install-gaming-mode.sh --probe` confirme
# que el rango min/max de tu 4050 lo permite.
NV_PL_POWERSAVER=""
NV_PL_BALANCED=""
NV_PL_PERFORMANCE=""

# runtime PM del bus PCI por perfil: auto | on
#   auto  -> la dGPU puede dormirse sola (lo correcto casi siempre)
#   on    -> la mantiene despierta; solo tiene sentido dentro de `gaming on`
NV_RUNTIME_POWERSAVER="auto"
NV_RUNTIME_BALANCED="auto"
NV_RUNTIME_PERFORMANCE="auto"
NV_RUNTIME_GAMING="on"

# ---------------------------------------------------------------------------
# Modo gaming
# ---------------------------------------------------------------------------
# Perfil de energía que fuerza `noctaliaq-power gaming on`.
GAMING_PROFILE="performance"

# Comandos extra al entrar/salir de gaming. Se ejecutan con `sh -c` y sus
# fallos no abortan nada. Ejemplo de inhibidor de idle vía IPC de Noctalia:
#   GAMING_ON_EXTRA="noctalia msg caffeine enable"
#   GAMING_OFF_EXTRA="noctalia msg caffeine disable"
GAMING_ON_EXTRA=""
GAMING_OFF_EXTRA=""

# ---------------------------------------------------------------------------
# iGPU (amdgpu)
# ---------------------------------------------------------------------------
# Vacio = no tocar. Es el default porque la auditoria del 2026-09-08 mostro que
# PPD 0.30 deja `power_dpm_force_performance_level` en "auto" en los tres
# perfiles: el nodo es nuestro si lo queremos, pero escribir "auto" en cada
# apply seria ruido puro.
# Deliberadamente NO se fuerza "high": en un APU Phoenix la iGPU comparte
# presupuesto de potencia con el CPU y con Dynamic Boost hacia la dGPU.
AMDGPU_DPM_LEVEL=""
